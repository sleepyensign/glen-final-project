name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          pyinstaller ^
            --clean ^
            --noconfirm ^
            --onedir ^
            --name The_Final ^
            main.py

      - name: Build Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onedir \
            --name The_Final \
            main.py

      - name: Copy Assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item maps -Destination dist/The_Final -Recurse
          Copy-Item media -Destination dist/The_Final -Recurse

      - name: Copy Assets (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp -r dialogue dist/The_Final/
          cp -r fonts dist/The_Final/
          cp -r imgs dist/The_Final/
          cp -r maps dist/The_Final/

      - name: Create Zip
        run: |
          python -c "import shutil; shutil.make_archive('The_Final-${{ runner.os }}','zip','dist','The_Final')"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The_Final-${{ runner.os }}
          path: The_Final-${{ runner.os }}.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: The_Final-${{ runner.os }}.zip